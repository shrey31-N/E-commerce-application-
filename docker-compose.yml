
services:
  user-service:
    build:
      context: ./services/user-service
    image: 507941515612.dkr.ecr.ap-southeast-2.amazonaws.com/shopsphere-user:v1.0.0
    container_name: user-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  product-service:
    build:
      context: ./services/product-service
    image: 507941515612.dkr.ecr.ap-southeast-2.amazonaws.com/shopsphere-product:v1.0.0
    container_name: product-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  order-service:
    build:
      context: ./services/order-service
    image: 507941515612.dkr.ecr.ap-southeast-2.amazonaws.com/shopsphere-order:v1.0.0
    container_name: order-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: 507941515612.dkr.ecr.ap-southeast-2.amazonaws.com/shopsphere-frontend:v1.0.0
    container_name: frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
