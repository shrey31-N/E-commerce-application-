services:
    user-service:
     build: ./services/user-service
     container_name: user-service
     restart: unless-stopped
     networks:
      - app-network

    product-service:
      build: ./services/product-service
      container_name: product-service
      restart: unless-stopped
      networks:
        - app-network

    order-service:
      build: ./services/order-service
      container_name: order-service
      restart: unless-stopped
      networks:
        - app-network

    frontend:
      build: ./frontend
      container_name: frontend
      restart: unless-stopped
      networks:
        - app-network
    nginx:
      image: nginx:alpine
      container_name: nginx
      restart: unless-stopped
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - frontend
        - user-service
        - product-service
        - order-service
      networks:
        - app-network  

networks:
  app-network:
    driver: bridge