
services:
  user-service:
    build: ./services/user-service
    image: user-service:v1.0.0
    container_name: user-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  product-service:
    build: ./services/product-service
    image: product-service:v1.0.0
    container_name: product-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  order-service:
    build: ./services/order-service
    image: order-service:v1.0.0
    container_name: order-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    image: frontend:v1.0.0
    container_name: frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  user-data:
  product-data:
  order-data:
